name: CI

on:
  push:
    branches: [main]
  pull_request:

# wiring review W-11: 既定の書き込み権限を渡さない（最小権限）。
permissions:
  contents: read

# wiring review W-11: 同じ ref への push が重なったら古い実行を捨てる。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # wiring review W-11: ぶら下がったジョブが 6 時間走り続けないようにする。
    timeout-minutes: 15
    env:
      # wiring review W-01: `uv sync --frozen` は stale な uv.lock を素通りさせ、
      # その後の裸の `uv run` が lock を黙って書き換える（CI の中で lock が変わる）。
      # UV_LOCKED=1 で全ての uv コマンドに「lock を書き換えるなら失敗せよ」を課す。
      UV_LOCKED: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # wiring review N-01: 版を固定しないと入る uv によって lock 検証の挙動が変わる。
          # 実測（2026-09-04）:
          #   uv 0.7.8  … `UV_LOCKED=1 uv sync --frozen` がクリーンでも EXIT=2（usage エラー）
          #   uv 0.12.9 … 同コマンドが warning のみで EXIT=0（lock 検証が飛ぶ）
          # 0.12.9 は本リポジトリの uv.lock で `uv lock --check` EXIT=0 /
          # `UV_LOCKED=1 uv sync` クリーン EXIT=0 / stale EXIT=1 を実測済み。
          # 根拠は decision-conformance.md §2.12。
          version: "0.12.9"
      # wiring review W-06: CI の Python を runner の既定に任せない。
      # uv は `.python-version` を**ネイティブに読む**ので、`uv sync` / `uv run` は
      # そこに書いた版で環境を作る（`setup-uv` 側に版を渡すと二重管理になる）。
      # 実測（2026-09-04）: astral-sh/setup-uv@v5 の action.yml が持つ入力は
      # `python-version` であり `python-version-file` は**存在しない**
      # （`curl -s https://raw.githubusercontent.com/astral-sh/setup-uv/v5/action.yml`）。
      # 存在しない入力を渡しても Actions は警告するだけで失敗しないため、指定しない。

      - name: Show Python version
        run: uv run python -c "import sys; print(sys.version)"

      # wiring review N-01: **`--frozen` を付けない**。`--frozen` は `UV_LOCKED` を打ち消し
      # （uv 0.12.9: `warning: Ignoring UV_LOCKED because --frozen was provided`）、
      # stale な uv.lock でも EXIT=0 になる。実測: stale lock で
      # `--frozen` あり EXIT=0 / `--frozen` なし EXIT=1。
      - name: Sync dependencies
        run: uv sync

      # FR-ARCH-002 / NFR-DEP-001 / ADR-004（DP-COMMON-11）:
      # jin-core → google-adk と jin レイヤの一方向性を機械で落とす。
      - name: Check dependency direction (import-linter)
        run: uv run lint-imports

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      # NFR-TEST-001: ネットワーク・API キー不要で通ること。
      # wiring review W-04: **テストより先にツリーを書き換えない**。
      # 生成スクリプトを先に走らせると、テスト側のドリフト検出
      # （test_committed_schema_has_no_drift）が常に整形済みのツリーを見ることになり、
      # 2 重の網が独立しなくなる。
      - name: Test
        run: uv run pytest

      # FR-MODEL-001: Pydantic 定義から再生成した JSON Schema がコミット済みと一致すること。
      # 差分が出たら `uv run python scripts/generate_schema.py` して再コミットする。
      # ツリーを書き換えずに比較する（W-04）。
      - name: Detect JSON Schema drift
        run: uv run jin schema | diff -u schemas/jin.schema.json -

      # Jin v2 の生成物（設計書 §11 #16 / #19）。ツリーを書き換えずに比較する（W-04 と同じ）。
      # abilities.json のドリフトは packages/jin-core/tests/test_v2_model.py が pytest 側で固定する。
      - name: Detect Jin v2 schema drift
        run: uv run jin schema --version 2 | diff -u schemas/jin-v2.schema.json -

      # 要件書 §9「examples/**/*.jin が全て validate を通る」
      - name: Check examples
        run: uv run jin check examples

      # NFR-DET-002: examples が正準形であること。
      - name: Check canonical form of examples
        run: uv run jin fmt --check examples

      # Jin v2 の例（examples/ の外に置く理由は設計書 §11 #18）。
      - name: Check examples-v2
        run: uv run jin check examples-v2 && uv run jin fmt --check examples-v2

      # Jin v2 Phase 2（設計書 §12「examples 3 本が jin run --ticks 300 で回る」）。pytest も同じことを
      # ライブラリ経由で見るが、ここは CLI の実プロセス（lupa の wheel が入ること）を確かめる。
      - name: Run examples-v2 headless (lupa)
        run: |
          uv run jin run examples-v2/paddle/paddle.jin --ticks 300 > /dev/null
          uv run jin run examples-v2/clicker/clicker.jin --ticks 300 > /dev/null
          uv run jin run examples-v2/fib/fib.jin --ticks 300 > /dev/null

      # Jin v2 Phase 3（設計書 §12「SVG スナップショットが安定」）。CLI の実プロセスで陣と手順の図を描く。
      - name: Render examples-v2
        run: |
          uv run jin render examples-v2/paddle/paddle.jin > /dev/null
          uv run jin render examples-v2/paddle/paddle.jin --focus Play/step > /dev/null
          uv run jin render examples-v2/clicker/clicker.jin --focus Clicker/screen > /dev/null

      # docs/document-review-agent.md の「動くサンプル」。examples/ の 3 本とは別枠
      # （本数を固定する契約テストがあるので examples/ には足さない）。
      # build / fake 実行 / 判定取り出しは tests/contract/test_docs_samples.py が見る。
      - name: Check docs samples
        run: uv run jin check docs/samples && uv run jin fmt --check docs/samples

      # 要件書 §8: プラグインの reference/ は docs/spec/ と schemas/ のコピーである。
      # ずれても `jin check` は通るので静かに効く（LLM が古い仕様で書こうとして失敗する）。
      # ツリーを書き換えずに比較する（W-04・schema drift と同じ規律）。
      - name: Detect plugin reference drift
        run: uv run python scripts/sync_plugin_reference.py --check

  # 要件書 §9「プラグイン: claude plugin validate を CI で実行」。
  # DP-REVIEW-JIN-003（Issue #9）が「CI に受け皿が無い」として起票していたもの。
  # Python の job とは道具立てが違う（Node と claude CLI）ので job を分ける。
  plugin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # DP-REVIEW-JIN-003 の 2 本目。Phase 4 では Node のセットアップだけを置き、
      # 入れる対象（`apps/editor`）が無い状態の `pnpm install` は書かなかった。
      # **Phase 5 で `apps/editor` ができたので pnpm を足した**（下の editor job）。
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Show Claude Code version
        run: claude --version

      # 要件書 §8 のレイアウトと .lsp.json / hooks の妥当性。
      # `--strict` は警告もエラー扱いにする（CI で緩めない）。
      - name: Validate the Claude Code plugin
        run: claude plugin validate --strict plugins/claude-code/jin

  # 要件書 §7 / §9「エディタ: pnpm test / Playwright スモーク」。
  # DP-REVIEW-JIN-003（Issue #9）の 2 本目がここで完結する。
  # Python と Node の両方が要る（スモークは実際の `jin editor` プロセスに繋ぐ）ので、
  # test job（Python だけ）でも plugin job（Node だけ）でもなく独立した job にする。
  editor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_LOCKED: "1"
    defaults:
      run:
        working-directory: apps/editor
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.9"

      # `jin editor` を動かすので Python 側も要る（スモークは実プロセスに繋ぐ）。
      - name: Sync Python dependencies
        working-directory: .
        run: uv sync

      # pnpm は `packageManager` の版で入れる（package.json が正本・二重管理にしない）。
      # **`package_json_file` が要る。** `defaults.run.working-directory` は `run:` にしか
      # 効かず `uses:` には効かないので、指定しないとリポジトリ直下の package.json を探して
      # 「No pnpm version is specified」で落ちる（直下に package.json は無い）。
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/editor/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/editor/pnpm-lock.yaml

      # `--frozen-lockfile` は lock と package.json のずれで落とす
      # （uv 側で `--frozen` を**付けない**のと同じ規律。こちらは名前が逆で、
      #  pnpm の `--frozen-lockfile` が「lock を書き換えるなら失敗せよ」に当たる）。
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # DP-COMMON-19 の 5 状態の網羅は **tsc** が落とす（`pnpm build` が tsc を含む）。
      - name: Build
        run: pnpm build

      # ユニット層（DP-COMMON-20 の 1 層目）。LSP はモックする。
      - name: Unit tests
        run: pnpm test

      # Jin v2 の実行パネル（設計書 §8）は `jin editor` が `/play/` として配るプレイヤー
      # （`apps/player/dist`）を使う。`e2e/v2.spec.ts` がそれを開くので、ここで一度ビルドする
      # （プレイヤー自身のゲートは player ジョブ）。
      - name: Build the player for the run panel
        working-directory: apps/player
        run: pnpm install --frozen-lockfile && pnpm build

      # スモーク層（同 2 層目）。ブラウザの取得はセットアップであり、
      # テスト自体は localhost の ws しか使わない（NFR-TEST-001）。
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Smoke (Playwright)
        run: pnpm e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/editor/playwright-report/
          retention-days: 7

  # Jin v2 Phase 4（設計書 §12「dist/ をブラウザで開いて paddle が遊べる。パリティ(Playwright)が通る」）。
  # editor ジョブと同じ道具立て（pnpm + Playwright）だが、Python 側との往復（`jin build` / `jin run --input` /
  # `scripts/sync_player.py` / `jin build --single`）を実プロセスで回すので job を分ける。
  player:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_LOCKED: "1"
      # 「同梱されていない側」の分岐を偶然通さない（tests/contract/test_player_contract.py）。
      JIN_REQUIRE_PLAYER: "1"
    defaults:
      run:
        working-directory: apps/player
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.12.9"

      # パリティ e2e は `jin build` / `jin run` の実プロセスに繋ぐ（lupa の wheel が要る）。
      - name: Sync Python dependencies
        working-directory: .
        run: uv sync

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/player/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/player/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # canvas.text の ASCII 以外の字形（abilities.md §2・設計書 §11 #49）。src/glyphs.ts は
      # apps/player/fonts/k6x8/k6x8_gothic.bdf からの生成物で、ツリーを書き換えずに比較する（W-04 と同じ）。
      # pytest 側は tests/contract/test_player_contract.py が `--check` で固定する（2 重の網）。
      - name: Detect glyph data drift
        working-directory: .
        run: uv run python scripts/generate_glyphs.py --stdout | diff -u apps/player/src/glyphs.ts -

      - name: Lint
        run: pnpm lint

      # dist/index.html / player.js / wasmoon.wasm（wasm は node_modules から複製。unpkg へは行かない）。
      - name: Build
        run: pnpm build

      # ユニット層。host.test.ts は実際の Wasmoon で命令数の上限（コルーチンの中）まで見る。
      - name: Unit tests
        run: pnpm test

      # 同梱（runtime.md §9）。gitignore された jin_wasm/player/ に 3 ファイルを置く。
      - name: Sync the player into jin_wasm
        working-directory: .
        run: uv run python scripts/sync_player.py && uv run python scripts/sync_player.py --check

      # 同梱されたプレイヤーが wheel に入ることを実測する（prelude.lua と同じ経路）。
      - name: Check the wheel carries the player
        working-directory: .
        run: |
          uv build --wheel --package jin-wasm --out-dir /tmp/jin-wasm-wheel
          uv run python -c "import glob, zipfile, sys; names = zipfile.ZipFile(glob.glob('/tmp/jin-wasm-wheel/jin_wasm-*.whl')[0]).namelist(); missing = [n for n in ('jin_wasm/player/index.html', 'jin_wasm/player/player.js', 'jin_wasm/player/wasmoon.wasm') if n not in names]; print(missing); sys.exit(1 if missing else 0)"

      # 同梱後の Python 側（JIN_REQUIRE_PLAYER=1 で「有る側」を要求する）と `jin build` の実プロセス。
      - name: Python tests that need the player
        working-directory: .
        run: |
          uv run pytest tests/contract/test_player_contract.py packages/jin-wasm/tests/test_jinrec_bundle.py packages/jin-cli/tests/test_build_run_v2.py
          uv run jin build examples-v2/paddle/paddle.jin --out /tmp/jin-paddle-dist
          test -f /tmp/jin-paddle-dist/player.js && test -f /tmp/jin-paddle-dist/wasmoon.wasm
          uv run jin build examples-v2/paddle/paddle.jin --out /tmp/jin-paddle-single --single
          test "$(ls /tmp/jin-paddle-single)" = "index.html"

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # パリティ層: 実ブラウザで録画 → jin run --input → トレース全行一致。--single も開く。
      - name: Parity (Playwright)
        run: pnpm e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: player-playwright-report
          path: apps/player/playwright-report/
          retention-days: 7
