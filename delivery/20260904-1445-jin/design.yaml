        message / hint。

        hint は LLM がそのまま編集に使うため具体値であること（NFR-LLM-001）。

        jin check --json と LSP publishDiagnostics は同じ生成関数を通る。'
    - name: 意味オペレーション（jin_core.ops）
      producer: jin-core
      consumers:
      - jin-lsp
      - apps/editor
      contract: 'v1 は 19 種（FR-LSP-005）。各オペレーションは JSON Pointer で対象を指定し、

        失敗時は診断コードで理由を返す。サーバは各オペレーションの逆オペレーションを応答に含める。

        undo/redo はクライアントが逆オペレーション列を保持する（要件書 §6.3）。'
    - name: SVG レンダリング
      producer: jin-render
      consumers:
      - jin-cli
      - jin-lsp
      - apps/editor
      contract: 'CLI の jin render と LSP の jin/renderSvg は同じ関数を呼び、同じ出力を返す（FR-RENDER-002）。

        レンダラは Python 1 本（要件書 §10 #9）。エディタは SVG をそのまま埋め込むだけで独自描画しない。'
    - name: LSP プロトコル
      producer: jin-lsp
      consumers:
      - apps/editor
      - Claude Code
      - VS Code
      contract: '言語サービスの唯一の入口（FR-LSP-001）。LSP 固有のロジックは位置変換とプロトコル露出だけに限定する。

        stdio と WebSocket は同一サーバ実装（FR-LSP-002）。

        ws モードでのファイル書き込み責務は DP-JIN-EDITOR-PROTOCOL-01 で未決。'
    - name: トレース JSONL
      producer: jin-adk
      consumers:
      - apps/editor
      contract: 'スキーマは seq / ts / agent / kind / name / pointer / input / output（要件書
        §3.4）。

        adk-api-probe.md の実測どおり ADK Event はこの形を持たないため、Jin 側で組み立てる派生スキーマである。

        agent は Event.author、ts は Event.timestamp から取る。pointer の採番箇所は DP-JIN-TRACE-POINTER-01
        で未決。'
  phase_order:
    note: 'ADR-001 の constraints「1 ラン内でも Phase 順に進め、§11 表の各 Phase 完了条件の充足を後続 Phase
