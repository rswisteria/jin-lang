domain_specific:
  ui_design_note: 'design.schema.json の ui_design（figma_url / screen_count 必須）は本ファイルで省略した。

    Figma のデザインファイルが存在せず（ADR-002 のとおりデザイナー不在）、

    figma_url に書くべき値が無いため。捏造した URL を置くより省略が正しい（T-002）。

    エディタの画面は実質 1 ページ（編集モード / デバッグモードをページ内で切り替える・DP-COMMON-18 推奨案）で、

    その構成要素は SVG キャンバス / プロパティパネル / 診断バッジ / タイムラインスクラバ / イベント詳細パネル。

    いずれも要件書 §7.1 / §7.2 が機能として規定しており、見た目の指定はない。'
  api_spec_note: 'design.schema.json の api_spec（openapi_path / style 必須）も省略した。

    style の enum は REST / GraphQL / tRPC / gRPC で、本案件の LSP JSON-RPC はいずれにも該当しない。

    サーバとクライアントの契約は boundary_contracts の LSP プロトコル と、

    要件書 §6.2（標準機能 8 種）/ §6.3（独自リクエスト 4 種 + 意味オペレーション 19 種）が正本。'
  local_dev_stack_note: 'design.schema.json の local_dev_stack（emulator_docker / emulator_host
    / cloud_direct）も省略した。

    ローカル開発時に接続する依存サービスが存在しないため、3 つの選択肢のいずれにも当てはまらない。

    テストは FakeLlm によりネットワークに一切出ない（NFR-TEST-001）。'
  aws_note: aws_api_requirements は省略。AWS を使わない（cloud なし）。
  data_model:
    note: 'db_schema が RDB を前提としており本案件の実態を表せないため、データモデルの構造をここに置く

      （degradation_notes の DEG-SCHEMA-DB-MISMATCH 参照）。

      これは要約であり、正本は Pydantic 定義（NFR-SSOT-001）と、そこから生成される

      schemas/jin.schema.json および docs/spec/model.md。本ファイルの記述と食い違う場合は正本が優先する。'
    source_of_truth:
    - Pydantic v2 のモデル定義（packages/jin-core/src/jin_core/model.py 相当）
    - schemas/jin.schema.json（Pydantic から生成しコミット・CI でドリフト検出）
    - docs/spec/model.md（意味論とキーの説明・LLM の参照資料）
    persistence: '単一の .jin ファイル（JSON・UTF-8・正準形）。v1 は単一ファイルのみで import なし（要件書 §10 #6）'
    root_keys:
    - key: $schema
      note: 先頭固定。スキーマの URL
    - key: version
      note: 先頭固定。将来拡張はこの値を上げる
    - key: root
      note: エントリポイントとなる circle 名。生成モジュールの root_agent になる
    - key: circles[]
      note: 配列順が描画順（12 時から時計回り）
    circle_keys:
    - key: name
      note: ファイル内一意。名前が ID（要件書 §10
    - key: core
      note: モデル文字列。core を持つと LlmAgent。core と flow は排他で両方持つ / 両方無いのは JIN022
    - key: description
      note: 任意
    - key: instruction.rune
      note: 指示テキスト。{state_key} テンプレートは透過。SHA-256 が装飾の決定的な種になる
    - key: tools[]
      note: 判別共用体。kind は tool（FunctionTool）/ builtin / summon（AgentTool）。circle 内一意
    - key: delegate[]
      note: サブ陣への委譲。LlmAgent.sub_agents になる
    - key: state[]
      note: 'circle 内一意。out: true のものだけが output_key になる'
    - key: flow
      note: kind は sequence / parallel / loop。steps は circle 名の配列。loop は max（LoopAgent.max_iterations）と
        exit の少なくとも一方が必須（JIN030）
    - key: flow.exit
      note: '{ key, equals } のみ（v1）。BaseAgent 継承の StateCheckAgent を生成する（DP-JIN-CODEGEN-RUNTIME-01）'
    - key: boundary.guards[]
      note: on は before_agent / after_agent / before_model / after_model / before_tool
        / after_tool。ADK のコールバック引数名に対応
    - key: boundary.await[]
      note: 人の介入点。LongRunningFunctionTool になる。境界環の欠けとして描かれる
    constraints:
    - 'additionalProperties: false（未知のキーはスキーマ違反 JIN002）'
    - 順序を持つものはすべて配列で、配列順が描画順を決める
    - Python 参照は module.path:callable 形式のみ。インライン Python は不可
    - 名前が ID であり、参照は名前で行う。rename は参照追随の意味オペレーション
    - 位置の鍵は JSON Pointer。data-jin / 診断 / トレースが同一の Pointer 空間を共有する
  success_criteria_mapping:
    note: 要件書 §0 の成功条件 6 件が、本設計のどの Phase の検証項目で満たされるかの対応。
    items:
    - criterion: .jin 1 つから adk run / adk web で動く ADK プロジェクトが生成される
      phase: 2
      verified_by: 生成モジュールの import テストと ADK オブジェクト木の検証（machine）+ 実 adk run（human_only）
    - criterion: 同じ .jin から常に同じ SVG が生成される
      phase: 3
      verified_by: 異なる PYTHONHASHSEED の別プロセス 2 回でのバイト一致テスト
    - criterion: Claude Code が jin check --json と LSP 診断だけで構文・意味エラーを修正しきれる
      phase: 1
      verified_by: 全診断コードの fixture が対応コードを 1 つだけ出し、hint に具体値が入ることの検査
    - criterion: LSP が Claude Code プラグインとして配布され .jin を開くと診断・定義ジャンプが効く
      phase: 4
      verified_by: pytest-lsp（stdio / ws）と claude plugin validate（machine）+ 実 Claude
        Code での確認（human_only）
    - criterion: 視覚エディタの編集がファイルに反映され開き直すと同じ状態に戻る
      phase: 5
      verified_by: 往復無損失テストと Playwright スモークのバイト一致
    - criterion: jin run --trace の出力をエディタで読み込み魔法陣上でイベントを追える
      phase: 6
      verified_by: Playwright でのスクラバ操作とオーバーレイ変化の検証
  next_actions:
  - 親が本ファイルを yaml.safe_load で構文検証する
  - 親が handoff.json の 17 件を auto-decider へ回し ai_provisional を確定させる
  - 確定後、ADR-003 以降を 8 件の候補（adr_list.adr_note 参照）に割り当てて起票する
  - 実装フェーズ Stage 1 で tech-version-check を実行し、adk-api-probe.md に無いバージョン（React / TypeScript
    / Vite / Playwright / ruff / import-linter）を実測する
