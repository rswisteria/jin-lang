- id: DP-JIN-SVG-DETERMINISM-01
  status: decided
  decision_record:
    decided_by: toyota
    decided_at: '2026-09-04T21:20:07+09:00'
    rationale: 'AI 仮判断（confidence: medium）を承認。'
    adr_ref: docs/adr/ADR-010-DP-JIN-SVG-DETERMINISM-01.md
    constraints:
    - text: 丸め桁数の具体値は本判断では確定しない。要件書に記載がないため、実装 Phase 3 で決定し根拠を docs/spec/layout.md
        に残す
      kind: condition
    - text: 推測に基づく丸め桁数を設計成果物に固定しない（T-002・具体値を捏造しない）
      kind: prohibition
    - text: 決定性テストは同一プロセス内 2 回ではなく、異なる PYTHONHASHSEED の別プロセス 2 回で行う（同一プロセス内の一致は辞書順序依存を検出できず偽
        green になりうる）
      kind: condition
    - text: 星形多角形 {n/k} の k は gcd による整数演算で求める。n の範囲と k が複数候補あるときの選択規則は Phase 0 の docs/spec/layout.md
        で一意に明文化する
      kind: condition
