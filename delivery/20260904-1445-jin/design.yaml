review_policy:
  timing: after_verify
  confidence_threshold_fix_now: 90
  rationale: '既定（after_verify / confidence_threshold_fix_now 90）をそのまま採用する。変更しない。

    根拠は本案件のテストの性質にある。§9 のテストマトリクス 11 対象はほぼ全てが機械判定可能

    （スナップショット・バイト一致・fixture 対応・往復無損失）であり、verify Stage の結果が

    レビューの一次情報として十分に強い。verify 前にレビューを走らせると、レビュアが

    「SVG が決定的か」「fmt が冪等か」を人力で推測することになり精度が落ちる。

    しきい値 90 を下げないのは、本案件が「黙って落とさない」（NFR-FAIL-001）を明示的な非機能要件に

    掲げており、確信の低い自動修正でエラーを握り潰すリスクの方が高いため。'
  review_axes_note: "Stage 5 Review の 4 並列（correctness / conventions / wiring / security）のうち\
    \ security は\n本案件では監査対象が薄い（NFR-SEC-001 のとおり認証要件なし・ネットワーク接続なし）。\nただし 0 にはしない。security\
    \ 観点で見るべきは次の 3 点に限定される。\n(1) jin run が生成コードを一時ディレクトリに書き出して import する経路（FR-ADK-004）—\
    \ 一時ディレクトリの\n    パーミッションと、.jin 由来の文字列がコード生成でエスケープされずに Python 式へ流れないか。\n(2) LSP\
    \ の WebSocket トランスポート（FR-LSP-002）が localhost 以外に bind しないか。\n(3) --resolve 指定時の\
    \ Python 参照 import（SC-S-001 / SC-S-002）が任意モジュールを実行しうる点の明示。"
