[project]
name = "jin-workspace"
version = "0.1.0"
description = "Jin(陣) — 魔法陣型エージェント記述言語 / uv workspace root"
requires-python = ">=3.12"
dependencies = [
  "jin-core",
  "jin-adk",
  "jin-render",
  "jin-cli",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
jin-core = { workspace = true }
jin-adk = { workspace = true }
jin-render = { workspace = true }
jin-cli = { workspace = true }

[dependency-groups]
# バージョンは delivery/20260904-1445-jin/version-matrix.md の実測に基づく（2026-09-04 取得）
dev = [
  "pytest>=9.1,<10",
  "ruff>=0.16,<1",
  "import-linter>=2.14,<3",
  # 生成 agent.py のスナップショット（要件書 §9「コード生成」）。版は version-matrix.md §8（Phase 2）
  "syrupy>=6.0,<7",
]

[tool.pytest.ini_options]
# ADR-003 (DP-COMMON-09): パッケージ単位の垂直分割 + tests/contract/ の横断契約テスト。
# rootdir 直下の tests/ と 各 packages/*/tests/ を単一の pytest 実行で集める。
# **パッケージ名を列挙しない**。列挙すると新しい packages/<name>/tests/ が
# 静かに収集対象から漏れる（wiring review W-03）。網羅は
# tests/contract/test_packaging_contract.py が機械で確認する。
testpaths = ["tests", "packages"]
# importlib モードはテストモジュールをフルパス由来の一意な名前で読み込む。
# prepend モードだと packages/*/tests/ に同名ファイル（test_model.py など）が
# 2 つできた瞬間に collection 全体が Interrupted になる（conventions review A-1）。
addopts = "-q --import-mode=importlib"
consider_namespace_packages = true
# packages/*/tests からも `tests.conftest`（requires_non_root などの共有マーカー）を import できるよう
# リポジトリ直下を sys.path に足す。importlib モードは sys.path を触らないので、これが無いと
# `uv run pytest packages/jin-adk/tests` の単独実行で ModuleNotFoundError になる（修正ラウンド 3・F-W-P2-202）
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
# delivery/ と docs/ は別モジュール由来の成果物・仕様書。ruff format が Markdown 内の
# コードブロックを書き換えてしまうため対象から外す（実測: lsp-api-probe.md が整形された）。
extend-exclude = ["delivery", "docs", ".venv"]

[tool.importlinter]
# ADR-004 (DP-COMMON-11): 依存の一方向性を機械で落とす。
# 契約の正本は design.yaml architecture.dependency_direction.rules の 8 行。
root_packages = ["jin_core", "jin_adk", "jin_render", "jin_cli"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "jin レイヤは一方向（jin_core が最下層）"
type = "layers"
# **兄弟パッケージは 1 要素の中に "|" 区切りで並べる**（wiring review W-05）。
# 単純なリストに並べると「jin_adk → jin_render は許す / jin_render → jin_adk は禁じる」
# という**実際の契約より強い順序**を宣言してしまう。
# Phase 3 以降の最終形（design.yaml architecture.dependency_direction.rules 3〜4）:
#   layers = ["jin_cli", "jin_lsp", "jin_adk | jin_render", "jin_core"]
# **Phase 3 で `"jin_adk | jin_render"` に書き換えた。** Phase 2 の時点で先に書いていたら
# import-linter 2.14 が `Missing layer 'jin_render': module jin_render does not exist.` で exit 1 に
# なっていた（2026-09-05 実測）。`jin_lsp` は Phase 4 でこの並びに足す（今書くと同じ理由で落ちる）。
# 素朴な直列（別要素に並べる）に戻すと
# tests/contract/test_packaging_contract.py::test_layers_contract_keeps_sibling_packages_in_one_element が落とす。
# パッケージを足すときは root_packages とこの行を同時に直すこと
# （同テストファイルが網羅を機械で確認する）。
layers = [
  "jin_cli",
  "jin_adk | jin_render",
  "jin_core",
]

[[tool.importlinter.contracts]]
name = "jin_core / jin_render は google-adk に依存しない"
type = "forbidden"
# design.yaml のルール 2 / 4。ADK の語彙が現れてよいのは jin_adk だけ（CLAUDE.md）。
# 契約名から `google-adk` の語を外さないこと
# （tests/contract/test_dependency_direction.py::test_import_linter_contracts_are_declared が見ている）。
source_modules = ["jin_core", "jin_render"]
forbidden_modules = ["google"]

[[tool.importlinter.contracts]]
# security review S1: `ref` を実際に import する実装（任意コード実行）は jin_cli にだけ置く。
# Phase 4 の jin-lsp は ws で外に出るので、そこから到達できないことを**機械で**落とす。
# 新しい root package を足したら source_modules にも足すこと
# （tests/contract/test_packaging_contract.py がそれを強制する）。
name = "任意コード実行の実装は jin_cli.resolver と jin_adk.runtime に閉じる"
type = "forbidden"
source_modules = ["jin_core", "jin_adk", "jin_render"]
# Phase 2: `jin run` の import 実装 `jin_adk.runtime` も対象（jin_core からは到達させない）。
# Phase 3: `jin_render` も対象（Phase 4 の `jin/renderSvg` が ws から呼ぶ経路の手前で閉じる）。
# Phase 4 で jin_lsp を作ったら source_modules に足す（ws 公開パスから両方へ到達させない・phase2-handoff.md §6）
forbidden_modules = ["jin_cli.resolver", "jin_adk.runtime"]
