[project]
name = "jin-glyph"
version = "0.1.0"
description = "Jin 陣書き: 魔法陣の画像(写真・Jin が描いた PNG)を場面グラフ経由で .jin に読む"
requires-python = ">=3.12"
# jin-glyph は jin-lsp / jin-wasmgc の**兄弟**(import-linter の layers 契約 `"jin_lsp | jin_wasmgc | jin_glyph"`)。
# 設計は docs/superpowers/specs/2026-10-03-jin-glyph-design.md §4.2。import するのは jin_cli だけ
# (`anthropic` を LSP の起動経路に乗せない)。紋の語彙と欄の順は jin_core.v2.glyph(レンダラと共有)。
dependencies = [
  # Claude 認識器（S4・jin_glyph.recognize）。版は 2026-10-03 の実測（1.11.0・
  # delivery/20260904-1445-jin/glyph-recognize-api-probe.md）。beta.messages.parse の fallbacks="default" を使う
  "anthropic>=1.11,<2",
  "jin-core",
  "jin-render",
  # 升の読み取り（S3・jin_glyph.cells）。版は 2026-10-03 の実測（12.3.0）
  "pillow>=12.3,<13",
]

[tool.uv.sources]
jin-core = { workspace = true }
jin-render = { workspace = true }

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jin_glyph"]
