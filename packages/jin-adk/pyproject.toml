[project]
name = "jin-adk"
version = "0.1.0"
description = "Jin → Google ADK のコード生成（build）・実行（run）・トレース・FakeLlm"
requires-python = ">=3.12"
# 版の根拠: delivery/20260904-1445-jin/version-matrix.md §8（Phase 2・2026-09-05 実測）
# google-adk は要件書 §1.1「2.x 系（メジャーを固定）」。テンプレートは 2.8.0 の実測 API に固定してある
# （jin_adk.TARGET_ADK_VERSION）。
dependencies = [
  "jin-core",
  "google-adk>=2.8,<3",
  "jinja2>=3.1,<4",
]

[tool.uv.sources]
jin-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jin_adk"]
