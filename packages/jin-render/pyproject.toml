[project]
name = "jin-render"
version = "0.1.0"
description = "Jin の決定的レイアウトと SVG 文字列生成（render / focus / trace overlay / data-jin）"
requires-python = ">=3.12"
# jin-render は **jin-core と標準ライブラリだけ**に依存する（design.yaml rule 4）。
# google-adk にも jin-adk にも依存しない（兄弟パッケージ。import-linter の layers 契約で落ちる）。
# SVG は標準ライブラリの文字列生成で作る（要件書 §1.1「SVG: 標準ライブラリで文字列生成」）ので
# 描画ライブラリを足さない。
dependencies = [
  "jin-core",
]

[tool.uv.sources]
jin-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jin_render"]
