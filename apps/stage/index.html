<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<title>Jin stage</title>
		<style>
			html, body { margin: 0; height: 100%; background: #080503; color: #e8dcc4; font: 13px "Hiragino Sans", system-ui, sans-serif; }
			#stage { position: relative; width: 100%; height: calc(100% - 96px); }
			#stage canvas { display: block; width: 100%; height: 100%; }
			#controls { height: 96px; box-sizing: border-box; padding: 6px 10px; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
			#controls input[type="range"] { flex: 1 1 240px; }
		</style>
	</head>
	<body>
		<div id="stage" data-testid="stage-view"></div>
		<div id="controls">
			<span data-testid="stage-status">SVG を待っています</span>
		</div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
