<!doctype html>
<html lang="ja">
	<head>
		<meta charset="utf-8" />
		<title>Jin stage</title>
		<style>
			html, body { margin: 0; height: 100%; background: #080503; color: #e8dcc4; font: 13px "Hiragino Sans", system-ui, sans-serif; }
			#stage { position: relative; width: 100%; height: calc(100% - 96px); }
			#stage canvas { display: block; width: 100%; height: 100%; }
			#controls { height: 96px; box-sizing: border-box; padding: 6px 10px; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
			#controls input[type="range"] { flex: 1 1 240px; }
		</style>
	</head>
	<body>
		<div id="stage" data-testid="stage-view"></div>
		<div id="controls">
			<button type="button" id="play" data-testid="stage-play">再生</button>
			<input type="range" id="scrub" data-testid="stage-scrub" min="0" max="0" step="0.01" value="0" />
			<output id="tick" data-testid="stage-tick">0</output>
			<label>構図
				<select id="preset" data-testid="stage-preset">
					<option value="overhead">俯瞰</option>
					<option value="oblique" selected>斜め 45°</option>
					<option value="low">低い煽り</option>
				</select>
			</label>
			<label>縦横比
				<select id="aspect" data-testid="stage-aspect">
					<option value="1:1" selected>1:1</option>
					<option value="16:9">16:9</option>
					<option value="9:16">9:16</option>
				</select>
			</label>
			<label>解像度
				<select id="resolution" data-testid="stage-resolution">
					<option value="1080" selected>1080</option>
					<option value="1440">1440</option>
					<option value="2160">2160</option>
				</select>
			</label>
			<label>速度
				<select id="speed" data-testid="stage-speed">
					<option value="1" selected>1×</option>
					<option value="0.5">0.5×</option>
				</select>
			</label>
			<label>開始 <input type="number" id="start" data-testid="stage-start" step="1" value="0" style="width:5em" /></label>
			<label>終了 <input type="number" id="end" data-testid="stage-end" step="1" value="0" style="width:5em" /></label>
			<label><input type="checkbox" id="caption" data-testid="stage-caption" checked /> 銘</label>
			<button type="button" id="export-video" data-testid="stage-export-video">動画を書き出す</button>
			<button type="button" id="export-png" data-testid="stage-export-png">この瞬間を PNG に</button>
			<button type="button" id="cancel" data-testid="stage-cancel" hidden>中止</button>
			<span id="codec" data-testid="stage-codec"></span>
			<span data-testid="stage-status" id="status">SVG を待っています</span>
			<span data-testid="stage-rows" id="rows">0</span>
		</div>
		<script type="module" src="/src/main.ts"></script>
	</body>
</html>
