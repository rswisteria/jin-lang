<!doctype html>
<html lang="ja">
	<body style="margin:0;background:#111">
		<iframe id="stage" src="/index.html" style="width:100vw;height:100vh;border:0"></iframe>
		<script type="module">
			const frame = document.getElementById("stage");
			frame.addEventListener("load", async () => {
				const svg = await (await fetch("/test/fixtures/play.svg")).text();
				const names = await (await fetch("/test/fixtures/paddle-names.json")).json();
				const rows = (await (await fetch("/test/fixtures/paddle-trace.jsonl")).text()).split("\n").filter(Boolean).map((l) => JSON.parse(l));
				frame.contentWindow.postMessage({ type: "stage.scene", svg, names, fps: 60, jinName: "paddle.jin", circleName: "Play" }, location.origin);
				frame.contentWindow.postMessage({ type: "stage.trace", rows, seed: 7 }, location.origin);
			});
		</script>
	</body>
</html>
