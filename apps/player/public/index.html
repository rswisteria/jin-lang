<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jin player</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; background: #16171a; color: #d8dbe0; font: 13px/1.4 system-ui, sans-serif; }
  #app { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px 16px; }
  #bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  #bar button, #bar input { font: inherit; color: inherit; background: #26282e; border: 1px solid #3a3d45; border-radius: 4px; padding: 4px 10px; }
  #bar button:hover { background: #30333b; }
  #bar button[aria-pressed="true"] { background: #4a3f1f; border-color: #a8862b; }
  #bar input { width: 6em; }
  #stage { background: #000; image-rendering: pixelated; outline: none; max-width: 100%; }
  #stage:focus { box-shadow: 0 0 0 2px #a8862b; }
  #screen { position: relative; max-width: 100%; }
  /* 見えないが、フォーカスと IME の候補窓の位置は持つ（display: none / visibility: hidden だとフォーカスできない） */
  #text { position: absolute; left: 0; top: 0; width: 1px; height: 1px; padding: 0; border: 0; opacity: 0; pointer-events: none; }
  #screen:focus-within #stage { box-shadow: 0 0 0 2px #a8862b; }
  #status { color: #9aa0aa; font-variant-numeric: tabular-nums; }
  #error { color: #ff8a80; white-space: pre-wrap; max-width: 60em; }
  #error:empty { display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="bar">
    <button id="run" type="button">実行</button>
    <button id="step" type="button">1 tick</button>
    <label>seed <input id="seed" type="number" step="1"></label>
    <button id="reboot" type="button">最初から</button>
    <button id="record" type="button" aria-pressed="false">録画</button>
    <button id="export" type="button" disabled>書き出し</button>
    <button id="forget" type="button">記憶を消す</button>
    <span id="status">読み込み中…</span>
  </div>
  <div id="screen">
    <canvas id="stage" tabindex="0" aria-label="stage"></canvas>
    <!-- 文字と IME を受ける入力欄（abilities.md §3 の input.text）。canvas は文字を受けられないので、ここにフォーカスを置く -->
    <input id="text" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="文字入力">
  </div>
  <pre id="error"></pre>
</div>
<!-- jin:bundle -->
<script src="player.js"></script>
</body>
</html>
